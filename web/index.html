<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FM Characterization Fact Label">
    <title>FM Fact Label</title>

    <link rel="icon" href="static/img/favicon.ico" type="image/x-icon">

    <!-- Styles -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="static/css/style.css" rel="stylesheet">

    <!-- Scripts -->
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ETY3FZE13S"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-ETY3FZE13S'); 
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7" defer></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js" defer></script>
    <script src="https://kit.fontawesome.com/d0a6ca53ae.js" crossorigin="anonymous" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/pdfkit@0.18.0/js/pdfkit.standalone.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/svg-to-pdfkit@0.1.8/source.min.js" defer></script>

    <script src="static/js/FileSaver.js" defer></script>

    <!-- Fact Label scripts -->
    <script type="module" src="static/js/FMFactLabel.js"></script>
    <script type="module" src="static/js/ui_utils.js"></script>
    <script type="module" src="static/js/main.js"></script>
</head>

<body>

    <nav class="navbar navbar-expand-lg py-4">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="static/img/favicon.ico" width="24" height="24" class="navbar-logo d-inline-block align-center me-2">
                FM Fact Label
            </a>
        </div>
    </nav>

    <main class="container mb-5">
        <div class="row g-4">
            
            <div class="col-lg-5">
                <div class="glass-card">
                    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#uploadFM">Upload FM</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#uploadCharacterization">Upload Characterization</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#about">About</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Upload FM Tab -->
                        <div class="tab-pane fade show active" id="uploadFM" role="tabpanel">
                            <div data-include="fm_upload_form.html" id="fm-form-container">
                                <div class="text-center p-4">
                                    <div class="spinner-border text-primary" role="status"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Upload Characterization Tab -->
                        <div class="tab-pane fade" id="uploadCharacterization" role="tabpanel">
                            <div data-include="characterization_upload_form.html" id="characterization-form-container">
                                <div class="text-center p-4">
                                    <div class="spinner-border text-primary" role="status"></div>
                                </div>
                            </div>
                        </div>

                        <!-- About Tab -->
                        <div class="tab-pane fade" id="about" role="tabpanel">
                            <div data-include="about.html" id="about-container">
                                <div class="text-center p-5">
                                    <div class="spinner-border text-primary" role="status"></div>
                                    <p class="mt-2 text-muted">Loading about...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="glass-card">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="m-0 fw-bold">Fact Label</h5>
                        <div class="dropdown d-none" id="exportDropdown">
                            <button class="btn btn-light btn-sm border" type="button" data-bs-toggle="dropdown">
                                <i class="fa-solid fa-download me-2"></i>Export
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" id="saveSVG" href="#">SVG</a></li>
                                <li><a class="dropdown-item" id="savePNG" href="#">PNG</a></li>
                                <li><a class="dropdown-item" id="savePDF" href="#">PDF</a></li>
                                <li><a class="dropdown-item" id="saveJSON" href="#">JSON</a></li>
                                <li><a class="dropdown-item" id="saveTXT" href="#">TXT</a></li>
                            </ul>
                        </div>
                    </div>

                    <div class="bg-light p-3 rounded-3 mb-4 small d-none" id="optionsPanel">
                        <div class="form-check form-switch d-inline-block me-3">
                            <input class="form-check-input" type="checkbox" id="collapseSubProperties" checked>
                            <label class="form-check-label" for="collapseSub">Collapse sub-properties</label>
                        </div>
                        <div class="form-check form-switch d-inline-block me-3">
                            <input class="form-check-input" type="checkbox" id="collapseZeroValues">
                            <label class="form-check-label" for="collapseZeroValues">Collapse zero values</label>
                        </div>
                        <div class="form-check form-switch d-inline-block me-3">
                            <input class="form-check-input" type="checkbox" id="checkZebraStriping">
                            <label class="form-check-label" for="checkZebraStriping">Zebra striping</label>
                        </div>
                        <div class="form-check form-switch d-inline-block me-3">
                            <input class="form-check-input" type="checkbox" id="checkRatioBar">
                            <label class="form-check-label" for="checkRatioBar">Show ratio bars</label>
                        </div>
                        <div class="form-check form-switch d-inline-block me-3">
                            <input class="form-check-input" type="checkbox" id="checkShowPercentages">
                            <label class="form-check-label" for="checkShowPercentages">Show percentages</label>
                        </div>
                        <div class="dropdown d-inline-block me-3">
                            <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" id="btnFilterMetrics">
                                <i class="fa-solid fa-list-check me-1"></i> Select Metrics
                            </button>
                            <div class="dropdown-menu p-3 shadow" style="min-width: 300px; width: fit-content; max-height: 400px; overflow-y: auto;">
                                <h6 class="dropdown-header ps-0">Visible Metrics</h6>
                                <div id="metricsSelectorContainer">
                                    </div>
                            </div>
                        </div>
                    </div>

                    <div class="label-container" id="progress-anchor">
                        <svg class="chart" id="FMFactLabelChart" style="width:100%; height:auto;"></svg>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
        <footer class="container footer text-center">
        <hr>
        <p>&copy; <span id="current-year"></span> • FM Fact Label</p>
    </footer>
    <!-- End of Footer -->
     

    <!-- Modal (preserved from your original code) -->
    <div class="modal fade" id="metricModal" tabindex="-1" aria-labelledby="metricModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 style="color:#2e59d9" id="metricModalLabel">Metric Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-break">
                    <!-- Modal content will be injected here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="copyButton">Copy</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
